<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c7322c">
  <meta name="description" content="The 3951 Halloween party bingo card. Tap a deed when it’s done.">
  <title>3951 Halloween Bingo</title>
  <link rel="icon" href="./assets/bat.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=8">
  <script type="module" src="./app.js?v=8"></script>
</head>
<body>
  <main class="invitation">
    <img class="corner top-left" src="./assets/corner.svg" alt="">
    <img class="corner top-right" src="./assets/corner.svg" alt="">
    <img class="corner bottom-left" src="./assets/corner.svg" alt="">
    <img class="corner bottom-right" src="./assets/corner.svg" alt="">
    <header>
      <div class="crest" aria-hidden="true"><span></span><img src="./assets/bat.svg" alt=""><span></span></div>
      <h1><span class="house">3951</span><span class="halloween">Halloween</span><span class="bingo">Bingo</span></h1>
      <p class="tagline" id="instructions">Tap a deed when it’s done.</p>
    </header>
    <section class="game" aria-label="Your bingo card">
      <div class="letters" aria-hidden="true"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
      <div id="board" class="board" aria-describedby="instructions"></div>
      <noscript><p>Enable JavaScript to play and save your bingo card.</p></noscript>
      <div class="progress" aria-live="polite" aria-atomic="true"><span id="deed-count">0 / 24 deeds done</span><span id="line-count">0 bingos</span></div>
      <div class="progress-track" aria-hidden="true"><div id="progress-fill"></div></div>
      <p id="storage-note" class="storage-note warning" role="status" hidden></p>
    </section>
    <footer>
      <div class="actions"><button id="share" class="text-button" type="button">Share the invitation <span aria-hidden="true">↗</span></button></div>
      <section class="rules" aria-labelledby="rules-title">
        <h2 id="rules-title">Rules</h2>
        <ul><li>Have fun</li></ul>
      </section>
      <p class="signoff">Happy Halloween.</p>
    </footer>
  </main>
  <div id="celebration" class="celebration" role="status" aria-live="polite" hidden><span aria-hidden="true">✦</span><strong>Beware… Bingo!</strong><span>A wickedly good line. Keep the mischief going.</span></div>
  <dialog id="share-dialog" aria-labelledby="share-title">
    <button class="close" id="close-share" aria-label="Close sharing">×</button>
    <p class="eyebrow">The more, the scarier.</p><h2 id="share-title">Invite a little mischief.</h2>
    <img class="qr" src="./assets/party-qr.svg" alt="QR code to open 3951 Halloween Bingo" width="240" height="240">
    <label for="share-url">The party link</label><input id="share-url" type="url" readonly>
    <button id="copy-link" class="primary">Copy link</button><p id="copy-status" role="status"></p>
    <a href="./assets/party-qr.svg" download="3951-halloween-bingo-qr.svg">Download QR code</a>
    <p class="fine-print">Each guest gets their own saved progress.</p>
  </dialog>
</body>
</html>
